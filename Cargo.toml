[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/indexer",
    "crates/llm",
    "crates/cli",
]

[workspace.package]
version = "0.20.0"
edition = "2024"
authors = ["kernel-x"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
tree-sitter = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sysinfo = "0.33"
toml = "0.8"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
