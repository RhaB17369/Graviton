[package]
name = "graviton-indexer"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
rusqlite = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
graviton-core = { path = "../core" }

tree-sitter = { workspace = true }
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-solidity = "1.2"
tree-sitter-powershell = "0.26"
tree-sitter-haskell = "0.23"
tree-sitter-fish = "3.6"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-perl = "1.1"
tree-sitter-r = "1.3"
tree-sitter-julia = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-elm = "5.9"
# Vendored, patched fork (not the stale crates.io 0.1.0 with no
# import-related node at all) -- see vendor/tree-sitter-nim/NOTICE.md.
tree-sitter-nim = { path = "../../vendor/tree-sitter-nim" }
tree-sitter-erlang = "0.20"
tree-sitter-groovy = "0.1"
tree-sitter-vim = "0.4"
tree-sitter-nix = "0.3"
tree-sitter-hcl = "1.1"
tree-sitter-cmake = "0.7"
tree-sitter-verilog = "1.0"
tree-sitter-vhdl = "1.4"
tree-sitter-fortran = "0.6"
tree-sitter-prolog = "0.1"
tree-sitter-racket = "0.25"
tree-sitter-scheme = "0.24"
tree-sitter-graphql = "0.2"
tree-sitter-proto = "0.5"
tree-sitter-objc = "3.0"
tree-sitter-glsl = "0.2"
tree-sitter-hlsl = "0.2"
tree-sitter-d = "0.8"
# The crates.io "0.1.0" release is from a brand-new, zero-star account
# ("undivisible") that batch-published several grammar crates the same
# day, and (confirmed via a real parse-tree dump) can't even parse
# `require "..."` as a call node at all. crystal-lang-tools is Crystal's
# own official tooling org (crystalline, the LSP, lives there too),
# actively maintained, and its real grammar DOES have a dedicated
# `require` node -- verified directly, not assumed. Vendored (this
# sandbox's git fetch to this specific host repeatedly failed on
# transient SSL/network errors, even with `net.git-fetch-with-cli`; a
# plain `git clone` of the same commit worked fine, so the source is
# real and verified, just not reliably fetchable as a live `git`
# Cargo dependency from here) -- see vendor/tree-sitter-crystal/NOTICE.md.
tree-sitter-crystal = { path = "../../vendor/tree-sitter-crystal" }
tree-sitter-asm = "0.24"
tree-sitter-ada = "0.1"
# The original tree-sitter-kotlin/-svelte/-vue/-wgsl/-latex crates on
# crates.io are all genuinely broken here (see git history for the exact
# type-mismatch/missing-scanner failures found and verified) -- not
# revisited blindly, but replaced with actively-maintained forks, each
# checked before adding: real crates.io downloads/update history, a
# `tree-sitter-language` (not raw `tree-sitter`) dependency (the modern
# ABI-stable shim every other grammar here already uses, which is what
# actually makes cross-grammar-vintage linking work), and in Latex's case,
# the actual scanner.c the original crate was missing. Kotlin/Svelte/Wgsl
# are `tree-sitter-grammars` org forks (Zed/Neovim/Helix's usual upstream
# for maintained grammars) or as close to it as a real fix could be found;
# Vue's had no equivalent published release, only an unpublished branch
# from that same org -- pinned by commit (not a floating branch) via a git
# dependency, since crates.io has no better option. Several *other*
# recently-published "tree-sitter-vue-*" crates were deliberately NOT used
# despite fixing the same symptom -- a cluster of near-identical,
# recently-published, unaffiliated-author crates around one popular
# missing package name is a real dependency-confusion/typosquat pattern,
# not just an abundance of choice.
tree-sitter-kotlin-ng = "1.1"
tree-sitter-svelte-ng = "1.0"
tree-sitter-wgsl-bevy = "0.1"
codebook-tree-sitter-latex = "0.6"
tree-sitter-vuejs = { git = "https://github.com/tree-sitter-grammars/tree-sitter-vue", rev = "ded84d24648b73a24b27f8f2d51c28f476bce584" }

[dev-dependencies]
tempfile = "3"
