[package]
name = "graviton-indexer"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
rusqlite = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
graviton-core = { path = "../core" }

tree-sitter = { workspace = true }
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-solidity = "1.2"
tree-sitter-powershell = "0.26"
tree-sitter-haskell = "0.23"
tree-sitter-fish = "3.6"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-perl = "1.1"
tree-sitter-r = "1.3"
tree-sitter-julia = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-elm = "5.9"
tree-sitter-nim = "0.1"
tree-sitter-erlang = "0.20"
tree-sitter-groovy = "0.1"
tree-sitter-vim = "0.4"
tree-sitter-nix = "0.3"
tree-sitter-hcl = "1.1"
tree-sitter-cmake = "0.7"
tree-sitter-verilog = "1.0"
tree-sitter-vhdl = "1.4"
tree-sitter-fortran = "0.6"
tree-sitter-prolog = "0.1"
tree-sitter-racket = "0.25"
tree-sitter-scheme = "0.24"
tree-sitter-graphql = "0.2"
tree-sitter-proto = "0.5"
tree-sitter-objc = "3.0"
tree-sitter-glsl = "0.2"
tree-sitter-hlsl = "0.2"
tree-sitter-d = "0.8"
tree-sitter-crystal = "0.1"
tree-sitter-asm = "0.24"
tree-sitter-ada = "0.1"
# tree-sitter-svelte/-vue/-wgsl are declared dependencies of this crate's
# other grammars' ecosystem but NOT added here: their Rust bindings return
# a `tree_sitter::Language` from an incompatible tree-sitter core version
# (0.20 vs. the 0.26 every other grammar here links against) -- it compiles
# but fails at final link time with "multiple different versions of crate
# `tree_sitter`". tree-sitter-latex similarly isn't included: its external
# scanner (used for raw/verbatim-environment lexing) fails to link with
# undefined `tree_sitter_latex_external_scanner_*` symbols. All three
# languages are still recognized + fully searchable (see `Lang::from_path`)
# via the tagged tier, same as Kotlin -- just without a real parse tree.

[dev-dependencies]
tempfile = "3"
