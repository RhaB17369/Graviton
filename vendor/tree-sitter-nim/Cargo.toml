# Vendored, locally patched copy of alaviss/tree-sitter-nim
# (https://github.com/alaviss/tree-sitter-nim), commit ac72ba30d16edf0be021588a9301ede4accd6cf4.
# See NOTICE.md in this directory for exactly what was changed and why.

[package]
name = "tree-sitter-nim"
description = "nim grammar for the tree-sitter parsing library (vendored fork)"
version = "0.6.2"
edition = "2018"
license = "MPL-2.0"
publish = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.0"
